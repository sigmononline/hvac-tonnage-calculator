<!DOCTYPE html>
<html>
<head>
  <title>HVAC Tonnage Calculator - Residential & Commercial</title>
  <meta name="description" content="Free HVAC tonnage calculator for residential and light commercial buildings. Estimate AC size by square footage, ceiling height, and climate zone.">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 420px 1fr;
      gap: 20px;
    }

    .ad {
      background: #e6e6e6;
      border: 1px dashed #aaa;
      height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #555;
      text-align: center;
    }

    .calculator {
      background: #ffffff;
      padding: 25px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      margin-top: 0;
    }

    label {
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 8px;
      margin: 6px 0 15px 0;
      box-sizing: border-box;
    }

    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
    }

    .disclaimer {
      font-size: 12px;
      color: #666;
      margin-top: 20px;
    }

    @media (max-width: 900px) {
      .page {
        grid-template-columns: 1fr;
      }
      .ad {
        height: 90px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- LEFT AD PLACEHOLDER -->
  <div class="ad">
    AdSense Placeholder<br>
    300x600 or 160x600
  </div>

  <!-- MAIN CALCULATOR -->
  <div class="calculator">
    <h1>HVAC Tonnage Calculator</h1>

    <label>Building Type</label>
    <select id="buildingType" onchange="updateClimateOptions()">
      <option value="residential">Residential</option>
      <option value="commercial">Commercial</option>
    </select>

    <label>Square Footage</label>
    <input id="sqft" type="number">

    <label>Ceiling Height (ft)</label>
    <input id="height" type="number" value="8">

    <label>Climate Zone</label>
    <select id="climate"></select>

    <button onclick="calculate()">Calculate</button>

    <h2 id="result"></h2>

    <div class="disclaimer">
      Rule-of-thumb estimate only. Final equipment sizing requires a Manual J or engineered load calculation.
    </div>
  </div>

  <!-- RIGHT AD PLACEHOLDER -->
  <div class="ad">
    AdSense Placeholder<br>
    300x600 or 160x600
  </div>

</div>

<script>
function updateClimateOptions() {
  var type = document.getElementById("buildingType").value;
  var climate = document.getElementById("climate");
  var options = [];

  if (type === "residential") {
    options = [
      { label: "Cool", value: 20 },
      { label: "Moderate", value: 25 },
      { label: "Warm", value: 30 }
    ];
  } else {
    options = [
      { label: "Cool", value: 25 },
      { label: "Moderate", value: 30 },
      { label: "Warm", value: 35 }
    ];
  }

  climate.innerHTML = "";
  for (var i = 0; i < options.length; i++) {
    var opt = document.createElement("option");
    opt.text = options[i].label;
    opt.value = options[i].value;
    climate.add(opt);
  }
}

function calculate() {
  var sqft = Number(document.getElementById("sqft").value);
  var height = Number(document.getElementById("height").value);
  var btuPerSqft = Number(document.getElementById("climate").value);

  if (!sqft || !height) {
    document.getElementById("result").innerText = "Please enter all values.";
    return;
  }

  var heightFactor = height / 8;
  var btu = sqft * btuPerSqft * heightFactor;
  var tons = btu / 12000;

  document.getElementById("result").innerText =
    "Estimated Load: " + tons.toFixed(2) +
    " tons (Typical recommendation: " + Math.ceil(tons) + " ton system)";
}

updateClimateOptions();
</script>

</body>
</html>
