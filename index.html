<!DOCTYPE html>
<html>
<head>
  <title>HVAC Tonnage Calculator – Residential & Commercial</title>
  <meta name="description" content="Free HVAC tonnage calculator for residential and light commercial buildings. Estimate AC size by square footage, ceiling height, and climate.">
</head>
<body>

<h1>HVAC Tonnage Calculator</h1>

<label>Building Type</label><br>
<select id="buildingType" onchange="updateClimateOptions()">
  <option value="residential">Residential</option>
  <option value="commercial">Commercial</option>
</select><br><br>

<label>Square Footage</label><br>
<input id="sqft" type="number"><br><br>

<label>Ceiling Height (ft)</label><br>
<input id="height" type="number" value="8"><br><br>

<label>Climate Zone</label><br>
<select id="climate"></select><br><br>

<button onclick="calculate()">Calculate</button>

<h2 id="result"></h2>

<p style="font-size: 12px;">
  Rule-of-thumb estimate only. Final sizing requires a Manual J or engineered load calculation.
</p>

<script>
function updateClimateOptions() {
  const type = document.getElementById("buildingType").value;
  const climate = document.getElementById("climate");

  let options = [];

  if (type === "residential") {
    options = [
      { label: "Cool", value: 20 },
      { label: "Moderate", value: 25 },
      { label: "Warm", value: 30 }
    ];
  } else {
    options = [
      { label: "Cool", value: 25 },
      { label: "Moderate", value: 30 },
      { label: "Warm", value: 35 }
    ];
  }

  climate.innerHTML = "";
  options.forEach(opt => {
    const o = document.createElement("option");
    o.text = opt.label;
    o.value = opt.value;
    climate.add(o);
  });
}

function calculate() {
  const sqft = Number(document.getElementById("sqft").value);
  const height = Number(document.getElementById("height").value);
  const btuPerSqft = Number(document.getElementById("climate").value);

  if (!sqft || !height) {
    document.getElementById("result").innerText = "Please enter all values.";
    return;
  }

  const heightFactor = height / 8;
  const btu = sqft * btuPerSqft * heightFactor;
  const tons = btu / 12000;

  document.getElementById("result").innerText =
    `Estimated Load: ${tons.toFixed(2)} tons (Typical recommendation: ${Math.ceil(tons)} ton system)`;
}

updateClimateOptions();
</script>

</body>
</html>
